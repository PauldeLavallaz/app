name: Verify

on:
  pull_request:
  push:
    branches:
      - morfeo-production

permissions:
  contents: read

jobs:
  frontend:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.10
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
